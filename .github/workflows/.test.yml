name: .test

on:
  workflow_call:
    inputs:
      creds-aws-role-arn:
        description: "creds for aws, specifies the role to assume via oidc. if not provided, aws auth is skipped"
        required: false
        type: string
      creds-aws-region:
        description: "creds for aws, specifies the region. defaults to us-east-1"
        required: false
        type: string
        default: "us-east-1"

# .why = least privilege: only the jobs that assume the aws role grant id-token, at job scope
permissions:
  contents: read

jobs:
  # install the dependencies
  install:
    uses: ./.github/workflows/.install.yml

  # run tests in parallel
  test-commits:
    runs-on: ubuntu-24.04
    needs: [install, test-shards-omit]
    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # we need all commits to test:commits

      - name: set node-version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".nvmrc"

      - name: get node-modules from cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ./node_modules
          key: ${{ needs.install.outputs.node-modules-cache-key }}

      - name: test:commits
        run: npm run test:commits

  test-types:
    runs-on: ubuntu-24.04
    needs: [install, test-shards-omit]
    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: set node-version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".nvmrc"

      - name: get node-modules from cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ./node_modules
          key: ${{ needs.install.outputs.node-modules-cache-key }}

      - name: build
        run: npm run build # build before test:types, to ensure .dist/ artifacts are importable for blackbox tests

      - name: test:types
        run: npm run test:types

  test-format:
    runs-on: ubuntu-24.04
    needs: [install, test-shards-omit]
    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: set node version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".nvmrc"

      - name: get node-modules from cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ./node_modules
          key: ${{ needs.install.outputs.node-modules-cache-key }}

      - name: test:format
        run: npm run test:format

  test-lint:
    runs-on: ubuntu-24.04
    needs: [install, test-shards-omit]
    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: set node-version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".nvmrc"

      - name: get node-modules from cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ./node_modules
          key: ${{ needs.install.outputs.node-modules-cache-key }}

      # .why = lint the same linked .agent/repo=* role tree a laptop holds
      - name: prepare:rhachet
        run: npm run prepare:rhachet --if-present

      - name: test:lint
        run: npm run test:lint

  test-unit:
    runs-on: ubuntu-24.04
    needs: [install, test-shards-omit]
    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: set node-version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".nvmrc"

      - name: get node-modules from cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ./node_modules
          key: ${{ needs.install.outputs.node-modules-cache-key }}

      - name: test:unit
        run: THOROUGH=true npm run test:unit

  # shard setup job
  enshard:
    name: enshard
    runs-on: ubuntu-24.04
    outputs:
      integration-matrix: ${{ steps.integration.outputs.matrix }}
      integration-patterns: ${{ steps.integration.outputs.patterns }}
      acceptance-matrix: ${{ steps.acceptance.outputs.matrix }}
      acceptance-patterns: ${{ steps.acceptance.outputs.patterns }}
    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: |
            jest.integration.shards.jsonc
            jest.acceptance.shards.jsonc
            .github/actions/test-shards-setup
          sparse-checkout-cone-mode: false

      - name: setup integration shards
        id: integration
        uses: ./.github/actions/test-shards-setup
        with:
          config-file: jest.integration.shards.jsonc
          test-type: integration

      - name: setup acceptance shards
        id: acceptance
        uses: ./.github/actions/test-shards-setup
        with:
          config-file: jest.acceptance.shards.jsonc
          test-type: acceptance

  # placeholder job for github actions visualization alignment
  # note: github actions has no column position controls;
  #       this job pushes test-* jobs one column right to align with test-shards-* column
  test-shards-omit:
    runs-on: ubuntu-24.04
    needs: [install]
    steps:
      - run: echo "👌 placeholder for column alignment"

  # shard runner jobs
  test-shards-integration:
    runs-on: ubuntu-24.04
    needs: [install, enshard]
    permissions:
      contents: read
      id-token: write # required for oidc
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.enshard.outputs.integration-matrix) }}
    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: set node-version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".nvmrc"

      - name: get node-modules from cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ./node_modules
          key: ${{ needs.install.outputs.node-modules-cache-key }}

      # .why = keyrack.yml can extend other manifests via symlinks (e.g., .agent/repo=ehmpathy/role=mechanic/keyrack.yml)
      #        prepare:rhachet creates these symlinks so keyrack.source() can hydrate extended keys
      - name: prepare:rhachet
        run: npm run prepare:rhachet --if-present

      # .why = keyrack firewall translates and validates secrets before tests run
      #        - filters to declared keys in keyrack.yml
      #        - translates mechanisms (e.g., GitHub App → ghs_* token)
      #        - blocks dangerous patterns (ghp_*, AKIA*, etc.)
      #        - exports to $GITHUB_ENV with mask applied
      - name: keyrack firewall
        run: npx rhachet keyrack firewall --env test --from 'json(env://SECRETS_JSON)' --into github.actions
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}

      - name: get aws auth, if creds supplied
        if: ${{ inputs.creds-aws-role-arn }}
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ inputs.creds-aws-role-arn }}
          aws-region: ${{ inputs.creds-aws-region }}

      - name: start:testdb
        run: npm run start:testdb --if-present

      - name: start:livedb:prep
        run: npm run start:livedb:prep --if-present

      - name: build
        run: npm run build

      - name: test:integration (explicit ${{ matrix.shard.index }})
        if: matrix.shard.type == 'explicit'
        run: |
          set -eu
          patterns='${{ join(matrix.shard.patterns, '|') }}'
          THOROUGH=true npm run test:integration -- --testPathPatterns="$patterns" --json --outputFile=jest-results.json

      - name: test:integration (dynamic ${{ matrix.shard.shard }}/${{ matrix.shard.total }})
        if: matrix.shard.type == 'dynamic'
        run: |
          set -eu
          exclude='${{ needs.enshard.outputs.integration-patterns }}'
          if [[ -n "$exclude" ]]; then
            THOROUGH=true npm run test:integration -- --testPathIgnorePatterns="$exclude" --shard=${{ matrix.shard.shard }}/${{ matrix.shard.total }} --json --outputFile=jest-results.json
          else
            THOROUGH=true npm run test:integration -- --shard=${{ matrix.shard.shard }}/${{ matrix.shard.total }} --json --outputFile=jest-results.json
          fi

      - name: report slow tests
        if: always() && hashFiles('jest-results.json') != ''
        run: bash .github/workflows/report-slow-tests.sh jest-results.json

  test-shards-acceptance:
    runs-on: ubuntu-24.04
    needs: [install, enshard]
    permissions:
      contents: read
      id-token: write # required for oidc
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.enshard.outputs.acceptance-matrix) }}
    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: set node-version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".nvmrc"

      - name: get node-modules from cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ./node_modules
          key: ${{ needs.install.outputs.node-modules-cache-key }}

      # .why = keyrack.yml can extend other manifests via symlinks (e.g., .agent/repo=ehmpathy/role=mechanic/keyrack.yml)
      #        prepare:rhachet creates these symlinks so keyrack.source() can hydrate extended keys
      - name: prepare:rhachet
        run: npm run prepare:rhachet --if-present

      # .why = keyrack firewall translates and validates secrets before tests run
      #        - filters to declared keys in keyrack.yml
      #        - translates mechanisms (e.g., GitHub App → ghs_* token)
      #        - blocks dangerous patterns (ghp_*, AKIA*, etc.)
      #        - exports to $GITHUB_ENV with mask applied
      - name: keyrack firewall
        run: npx rhachet keyrack firewall --env test --from 'json(env://SECRETS_JSON)' --into github.actions
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}

      - name: get aws auth, if creds supplied
        if: ${{ inputs.creds-aws-role-arn }}
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ inputs.creds-aws-role-arn }}
          aws-region: ${{ inputs.creds-aws-region }}

      - name: start:testdb
        run: npm run start:testdb --if-present

      - name: start:livedb:prep
        run: npm run start:livedb:prep --if-present

      - name: build
        run: npm run build

      # .why = the PR acceptance gate runs IN-PROCESS (LOCALLY=true), not against a deployed fleet.
      #        a PR has no deployed lambda to invoke, and a service that publishes only dev/prep (no
      #        `test` fleet) would target `svc-<name>-test-*` — a slug that does not exist — and 404
      #        on every call. in-process runs the handler directly, so a fleetless service inherits a
      #        green PR gate out of the box rather than hand-patching LOCALLY=true into this shard.
      #        the deployed-fleet acceptance run is a separate post-deploy grain (.deploy-sls.yml).
      - name: test:acceptance (explicit ${{ matrix.shard.index }})
        if: matrix.shard.type == 'explicit'
        run: |
          set -eu
          patterns='${{ join(matrix.shard.patterns, '|') }}'
          LOCALLY=true THOROUGH=true npm run test:acceptance -- --testPathPatterns="$patterns" --json --outputFile=jest-results.json

      - name: test:acceptance (dynamic ${{ matrix.shard.shard }}/${{ matrix.shard.total }})
        if: matrix.shard.type == 'dynamic'
        run: |
          set -eu
          exclude='${{ needs.enshard.outputs.acceptance-patterns }}'
          if [[ -n "$exclude" ]]; then
            LOCALLY=true THOROUGH=true npm run test:acceptance -- --testPathIgnorePatterns="$exclude" --shard=${{ matrix.shard.shard }}/${{ matrix.shard.total }} --json --outputFile=jest-results.json
          else
            LOCALLY=true THOROUGH=true npm run test:acceptance -- --shard=${{ matrix.shard.shard }}/${{ matrix.shard.total }} --json --outputFile=jest-results.json
          fi

      - name: report slow tests
        if: always() && hashFiles('jest-results.json') != ''
        run: bash .github/workflows/report-slow-tests.sh jest-results.json

  # .why = evaluation tests grade a brain's output and sit outside the unit, integration, and
  #        acceptance globs, so no other job runs them. in a repo with no `test:evaluation`
  #        command, every step after the presence check is skipped, so the job costs one checkout
  test-evaluation:
    runs-on: ubuntu-24.04
    needs: [install]
    permissions:
      contents: read
      id-token: write # required for oidc
    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: has test:evaluation?
        id: presence
        run: echo "declared=$(jq -r '.scripts["test:evaluation"] != null' package.json)" >> "$GITHUB_OUTPUT"

      - name: set node-version
        if: steps.presence.outputs.declared == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".nvmrc"

      - name: get node-modules from cache
        if: steps.presence.outputs.declared == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ./node_modules
          key: ${{ needs.install.outputs.node-modules-cache-key }}

      - name: prepare:rhachet
        if: steps.presence.outputs.declared == 'true'
        run: npm run prepare:rhachet --if-present

      - name: keyrack firewall
        if: steps.presence.outputs.declared == 'true'
        run: npx rhachet keyrack firewall --env test --from 'json(env://SECRETS_JSON)' --into github.actions
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}

      - name: get aws auth, if creds supplied
        if: ${{ steps.presence.outputs.declared == 'true' && inputs.creds-aws-role-arn }}
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ inputs.creds-aws-role-arn }}
          aws-region: ${{ inputs.creds-aws-region }}

      - name: start:testdb
        if: steps.presence.outputs.declared == 'true'
        run: npm run start:testdb --if-present

      - name: build
        if: steps.presence.outputs.declared == 'true'
        run: npm run build

      - name: test:evaluation
        if: steps.presence.outputs.declared == 'true'
        run: npm run test:evaluation --if-present

  # union job: aggregates shard results into single status for pr merge constraints
  test-integration:
    runs-on: ubuntu-24.04
    needs: [install, enshard, test-shards-integration]
    if: always() && needs.install.result == 'success' && needs.enshard.result == 'success'
    steps:
      - name: report shard results
        run: |
          set -eu
          if [[ "${{ needs.test-shards-integration.result }}" == "success" ]]; then
            echo "👌 all integration test shards passed"
          else
            echo "::error::some integration test shards failed"
            exit 1
          fi

  # union job: aggregates shard results into single status for pr merge constraints
  test-acceptance-locally:
    runs-on: ubuntu-24.04
    needs: [install, enshard, test-shards-acceptance]
    if: always() && needs.install.result == 'success' && needs.enshard.result == 'success'
    steps:
      - name: report shard results
        run: |
          set -eu
          if [[ "${{ needs.test-shards-acceptance.result }}" == "success" ]]; then
            echo "👌 all acceptance test shards passed"
          else
            echo "::error::some acceptance test shards failed"
            exit 1
          fi
